<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg1)" rx="24" />
  <circle cx="700" cy="150" r="180" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="100" cy="700" r="220" fill="#ffffff" fill-opacity="0.06" />
  
  <!-- Content Card -->
  <rect x="70" y="80" width="660" height="640" rx="30" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Badge -->
  <rect x="120" y="130" width="220" height="42" rx="21" fill="#ede9fe" />
  <text x="230" y="157" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#6d28d9" text-anchor="middle">META AD CREATIVE</text>
  
  <!-- Main Copy -->
  <text x="120" y="240" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" fill="#0f172a" line-height="1.2">
    SCALE YOUR E-COM
  </text>
  <text x="120" y="295" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" fill="#7c3aed">
    TO 4.2X ROAS
  </text>
  
  <text x="120" y="360" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="500" fill="#64748b">
    High-converting UGC hooks, Advantage+ audience
  </text>
  <text x="120" y="390" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="500" fill="#64748b">
    targeting, and direct-response carousel designs.
  </text>
  
  <!-- Metric Box -->
  <rect x="120" y="440" width="560" height="120" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  
  <text x="160" y="490" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="900" fill="#10b981">+140%</text>
  <text x="160" y="525" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#64748b">REVENUE UPLIFT</text>
  
  <text x="350" y="490" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="900" fill="#6366f1">-32%</text>
  <text x="350" y="525" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#64748b">LOWER CPA</text>

  <text x="540" y="490" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="900" fill="#8b5cf6">4.2X</text>
  <text x="540" y="525" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#64748b">AVG ROAS</text>

  <!-- CTA Button -->
  <rect x="120" y="595" width="280" height="60" rx="30" fill="url(#bg1)" filter="url(#shadow)" />
  <text x="260" y="632" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">SHOP NOW →</text>
  
  <text x="440" y="632" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">LIMITED TIME OFFER</text>
</svg>
